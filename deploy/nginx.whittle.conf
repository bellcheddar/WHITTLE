# nginx site for WHITTLE. provision.sh substitutes __SERVER_NAME__ and
# __BIND_ADDR__ and installs this to /etc/nginx/sites-available/whittle, then
# `certbot --nginx` adds the TLS block and the port-80 redirect.
# Copied from debris/deploy/nginx.debris.conf (see REUSE.md); the gzip_static
# block for .pdb.gz is WHITTLE's own (spec 8.4).

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    # No uploads: all compute is offline on the Studio and the only thing a
    # reader sends is a query string (spec 8.4).
    client_max_body_size 1m;

    # Predicted models, shipped pre-gzipped. The URL asks for <id>.pdb and
    # gzip_static serves <id>.pdb.gz from disk with Content-Encoding: gzip, so
    # the browser decompresses transparently and Mol* reads plain PDB
    # (spec 8.4). Serving the .gz at its own URL instead would hand the browser
    # raw gzip bytes with no encoding header. `always` means the compressed
    # file is used even for a client that did not advertise gzip, and
    # `gunzip on` decompresses for that client rather than failing it.
    location /structures/ {
        alias /opt/whittle/data/structures/;
        gzip_static always;
        gunzip on;
        types { }
        default_type chemical/x-pdb;
        add_header Cache-Control "public, max-age=604800" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location /static/ {
        alias /opt/whittle/app/static/;
        # Assets are versioned with ?v=<mtime>, so a changed file refetches
        # while molstar.js (5 MB) and the fonts cache hard.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        gzip on;
        gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
        gzip_min_length 1024;
    }

    location / {
        proxy_pass http://__BIND_ADDR__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
